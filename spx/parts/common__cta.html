<!-- 숏플래너스 · home / cta · 공통 CTA (모든 페이지 맨 아래, 아임웹 푸터 바로 위)
     아임웹 코드 위젯에 이 파일 내용을 그대로 붙여 넣으세요. (00_common 위젯이 이 페이지 맨 위에 있어야 합니다) -->
<div class="spx" data-spx-page="home">
<section class="cta" id="spx-contact">
  <div class="wrap">
    <div class="cta-copy">
      <h2>숏플래너스와 함께,<br>브랜드의 <span class="y">다음 성장</span>을 시작하세요.</h2>
      <p>우리 브랜드에 맞는 숏폼, 어디서부터 시작해야 할까요?<br>계정과 업종을 살펴보고, 콘텐츠 방향과 필요한 서비스를 제안해드립니다.</p>
      <div class="ctas">
        <a class="btn btn-white" href="/consult" data-spx-route="consult">무료 상담 신청 <span class="arr">→</span></a>
        <a class="btn btn-ghost" href="/work" data-spx-route="work">포트폴리오 보기</a>
      </div>
    </div>
    <div class="cta-vis cta-stage" id="ctaStage" aria-hidden="true">
      <div class="stage-3d">
        <div class="wall cta-wall" id="ctaWall"><div class="col"></div><div class="col"></div><div class="col"></div></div>
      </div>
      <div class="cta-fade"></div>
      <div class="stage-labels">
        <div class="cv-chip ch-a"><span class="ic">✉</span><div><b>새 DM 문의</b><small>“상담 가능할까요?”</small></div></div>
        <div class="cv-chip ch-b"><span class="ic ic-y">↗</span><div><b>프로필 방문 늘어남</b><small>릴스에서 프로필로</small></div></div>
        <div class="cv-chip ch-c"><span class="ic ic-w">+</span><div><b>새 팔로워</b><small>방금 전</small></div></div>
      </div>
    </div>
  </div>
  <div class="cta-vig" aria-hidden="true"></div>
</section>
</div>
<script>
SPX.def('home:cta', function(S){
  var cs = document.getElementById('ctaStage'); if(!cs) return;
  S.fillWall(document.getElementById('ctaWall'));
  S.watch(cs);
  S.onView(cs, function(on){ cs.classList.toggle('paused', !on); }, {rootMargin:'80px'});
});
</script>
