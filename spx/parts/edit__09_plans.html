<!-- 숏플래너스 · edit / price (코드) -->
<div class="spx" data-spx-page="edit">
<section class="sec" style="background:var(--bg-2)">
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
        <div>
          <p class="eyebrow">Plans</p>
          <h2 class="h2" style="margin-top:14px">숏폼 편집 가격</h2>
        </div>
        <p class="plans-note">모든 금액 VAT 별도</p>
      </div>
      <div class="price-grid" id="editPrice"></div>
      <div class="single-note"><div><b>단건 편집</b><span>한 편부터 맡기실 수 있습니다.</span></div><strong class="num">편당 15만원</strong><em>VAT 별도</em></div>
    </div>
  </section>
</div>
<script>
SPX.def('edit:price', function(S){ var el=document.getElementById('editPrice'); if(el && S.priceCards) el.innerHTML=S.priceCards('edit'); });
</script>
