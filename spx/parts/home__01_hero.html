<!-- 숏플래너스 · home / hero
     아임웹 코드 위젯에 이 파일 내용을 그대로 붙여 넣으세요. (00_common 위젯이 이 페이지 맨 위에 있어야 합니다) -->
<div class="spx" data-spx-page="home">
<section class="hero night">
    <div class="wrap">
      <div>
        <h1>
          <span class="line">트래픽부터 매출까지.</span>
          <span class="line">브랜드를 <span class="blue">퀀텀 점프</span> 시키는</span>
          <span class="line">숏폼 대행사</span>
        </h1>
        <p class="lead">계정 전략부터 기획, 대본, 편집, 캡션까지<br>숏플래너스가 A부터 Z까지 설계합니다.</p>
        <div class="ctas">
          <a class="btn btn-blue" href="/consult" data-spx-route="consult">무료 상담 신청 <span class="arr">→</span></a>
        </div>
        <div class="hero-points">
          <a href="/allin" data-spx-route="allin">숏폼 올인원</a><a href="/edit" data-spx-route="edit">숏폼 편집</a><a href="/carousel" data-spx-route="carousel">AI 카드뉴스</a>
        </div>
      </div>

      <div class="stage" id="stage" aria-hidden="true">
        <div class="stage-3d">
          <div class="wall" id="wall">
            <div class="col" data-col="c01,c04,c07,c10,c13,c16"></div>
            <div class="col" data-col="c02,c05,c08,c11,c14,c17"></div>
            <div class="col" data-col="c03,c06,c09,c12,c15,c18"></div>
          </div>
        </div>
        <div class="stage-labels">
        <div class="chip3d chip-a"><span class="dot"></span><div><b>HOOK</b><small>0–3초, 손가락을 멈추게</small></div></div>
        <div class="chip3d chip-b"><span class="dot" style="background:var(--blue-2);box-shadow:0 0 0 6px rgba(50,130,255,.2)"></span><div><b>RETENTION</b><small>시청 지속시간·팬덤</small></div></div>
        <div class="chip3d chip-c"><span class="dot" style="background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.15)"></span><div><b>ACTION</b><small>매출·CTA·전환</small></div></div>
        </div>
      </div>
    </div>
    <div class="hero-vig" aria-hidden="true"></div>
  </section>
</div>
<script>
SPX.def('home:heroWall', function(S){
  var wall = document.getElementById('wall'), stage = document.getElementById('stage');
  S.fillWall(wall);
  if(stage && wall && !S.reduce){
    stage.parentElement.addEventListener('pointermove', function(e){
      var r = stage.getBoundingClientRect(), x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      wall.style.transform = 'rotateX('+(22 - y*10)+'deg) rotateY('+(-24 + x*14)+'deg) rotateZ(8deg)';
    });
    stage.parentElement.addEventListener('pointerleave', function(){ wall.style.transform=''; });
  }
});
</script>
