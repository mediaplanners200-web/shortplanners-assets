<!-- 숏플래너스 · home / how-we-design
     아임웹 코드 위젯에 이 파일 내용을 그대로 붙여 넣으세요. (00_common 위젯이 이 페이지 맨 위에 있어야 합니다) -->
<div class="spx" data-spx-page="home">
<section class="anat sec">
    <div class="wrap">
      <p class="eyebrow">How we design</p>
      <h2 class="h2" style="margin-top:14px">숏폼 한 편을<br><span class="blue">세 구간</span>으로 나눠 설계합니다</h2>
      <div class="anat-grid">
        <div class="anat-list" role="tablist" aria-label="설계 구간">
          <button class="anat-item" role="tab" aria-selected="true" data-step="0">
            <span class="k">0–3초 · HOOK</span>
            <h3>손가락을 멈추게</h3>
            <p>첫 문장, 첫 컷, 화면 문구를 따로 기획합니다. 넘기기 전에 "어? 내 얘기네" 하게 만드는 3초.</p>
          </button>
          <button class="anat-item" role="tab" aria-selected="false" data-step="1">
            <span class="k">3초–끝 · RETENTION</span>
            <h3>끝까지 보게</h3>
            <p>정보 순서, 컷 길이, 자막 리듬을 대본에서 정합니다. 중간에 나갈 틈을 없앱니다.</p>
          </button>
        </div>
        <div>
          <div class="anat-phone">
            <div class="anat-over" id="anatOver" style="top:16%">HOOK · "근로계약서 잘못 쓰면 벌금 500만원?"</div>
            <div class="phone"><video data-spx-src="media/c04_blur.mp4" data-spx-poster="media/c04_blur.jpg" muted loop playsinline autoplay preload="metadata"></video></div>
          </div>
          <div class="timeline" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
          <div class="tl-label"><span>0s</span><span>3s</span><span>…</span><span>END</span></div>
        </div>
        <div class="anat-list anat-right" role="tablist" aria-label="설계 구간 계속">
          <button class="anat-item" role="tab" aria-selected="false" data-step="2">
            <span class="k">마지막 · ACTION</span>
            <h3>프로필을 누르게</h3>
            <p>프로필 방문, 저장, DM 키워드 중 영상마다 시청자가 할 행동 하나를 정해 넣습니다.</p>
          </button>
          <div class="anat-big" aria-hidden="true">3<br>STEP</div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
SPX.def('home:anat', function(S){
  var sec = document.getElementById('anatOver'); if(!sec) return;
  var steps = [
    {top:'16%', bg:'rgba(255,220,65,.95)', fg:'#0A0B0F', t:'HOOK · "근로계약서 잘못 쓰면 벌금 500만원?"'},
    {top:'46%', bg:'rgba(0,102,255,.92)', fg:'#fff', t:'RETENTION · 사례 → 이유 → 해결 순서'},
    {top:'74%', bg:'rgba(255,255,255,.95)', fg:'#0A0B0F', t:'ACTION · "프로필에서 체크리스트 받기"'}
  ];
  var root = sec.closest('section') || document;
  var items = root.querySelectorAll('.anat-item'), bars = root.querySelectorAll('.timeline i'), cur = 0, timer;
  function pick(n){
    cur = n;
    items.forEach(function(b){ b.setAttribute('aria-selected', +b.dataset.step===n); });
    bars.forEach(function(b,i){ b.classList.toggle('on', i===n); });
    sec.style.top = steps[n].top; sec.style.background = steps[n].bg; sec.style.color = steps[n].fg; sec.textContent = steps[n].t;
  }
  items.forEach(function(b){ b.addEventListener('click', function(){ pick(+b.dataset.step); clearInterval(timer); }); });
  pick(0);
  if(!S.reduce) timer = setInterval(function(){ pick((cur+1)%3); }, 3200);
});
</script>
