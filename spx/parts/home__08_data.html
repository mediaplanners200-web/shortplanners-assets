        <span class="rd-ex">실제 고객 리포트 화면 · 계정 정보는 가림 처리</span>
      </div></div></div></div>
<script>
SPX.def('home:radar', function(S){
  var box = document.getElementById('radar'); if(!box) return;
  var tabs = [].slice.call(box.querySelectorAll('.rd-tabs button')), imgs = [].slice.call(box.querySelectorAll('.rd-shot img'));
  var keys = tabs.map(function(b){ return b.dataset.k; }), cur = 0, timer;
  function show(i){ cur = i; tabs.forEach(function(b,j){ b.setAttribute('aria-selected', j===i); }); imgs.forEach(function(im){ im.classList.toggle('on', im.dataset.k===keys[i]); }); }
  function auto(){ clearInterval(timer); if(!S.reduce) timer = setInterval(function(){ show((cur+1)%keys.length); }, 4200); }
  tabs.forEach(function(b,i){ b.addEventListener('click', function(){ show(i); auto(); }); });
  box.addEventListener('pointerenter', function(){ clearInterval(timer); });
  box.addEventListener('pointerleave', auto);
  show(0); auto();
});
</script>
