<!-- 숏플래너스 · home / plans (가격표 3장 + 촬영 옵션) · 제목까지 모두 코드 -->
<div class="spx" data-spx-page="home">
<section class="sec" style="background:var(--bg-2)">
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
        <div>
          <p class="eyebrow">Plans</p>
          <h2 class="h2" style="margin-top:14px">가격은 <span class="mark">숨기지</span> 않습니다</h2>
        </div>
        <p class="plans-note">숏폼 올인원 기준입니다.</p>
      </div>
      <div class="price-grid" id="homePrice"></div>
      <div class="shoot" style="margin-top:clamp(28px,3.5vw,44px)">
        <div style="position:relative;z-index:1">
          <p class="eyebrow">Shooting option</p>
          <h3 style="margin-top:10px">촬영은 직접 하셔도 충분합니다.<br>원하시면 PD가 찾아갑니다.</h3>
          <p>숏폼은 스마트폰 촬영으로도 충분합니다.<br class="pb">촬영은 고객 직접 진행을 기본으로 하며,<br class="pb">필요 시 PD 1일 출장 촬영을 별도로 제공합니다.<br class="pb">월 제작 분량의 촬영을 목표로 하되,<br class="pb">콘텐츠 구성에 따라 일정과 분량을 사전 협의합니다.</p>
        </div>
        <div class="opt"><small>선택 옵션</small><b>1일 출장 촬영</b><div class="opt-price"><strong class="num">60만원</strong><em>VAT 별도</em></div><span>올인원 · 편집 서비스 모두 추가 가능</span></div>
      </div>
    </div>
  </section>
</div>
<script>
SPX.def('home:plans', function(S){
  var el = document.getElementById('homePrice');
  if(el && S.priceCards) el.innerHTML = S.priceCards('allin');
});
</script>
