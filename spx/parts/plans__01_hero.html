<script>
SPX.def('plans:plansHero', function(S){
  var ms = document.querySelectorAll('.spx .pl-vis2 .pm[data-n]');
  if(ms.length && S.SPV.length){
    ms.forEach(function(m){
      S.onView(m, function(on){
        var v = m.querySelector('video'), d = S.SPV[+m.dataset.n-1]; if(!v || !d) return;
        if(on && !S.reduce){ if(!v.src) v.src = d.v; var p = S.play(v); if(p&&p.then) p.then(function(){ m.classList.add('playing'); }).catch(function(){}); }
        else v.pause();
      }, {threshold:.25});
    });
  }
  var bg = document.getElementById('mqBg'); if(!bg) return;
  var list = S.heroList();
  if(list.length){
    var cards = ['conv1','traf1','traf2','news1','news2'], rows = 4, per = Math.ceil(list.length/rows), ci = 0, html = '';
    for(var r=0;r<rows;r++){
      var part = list.slice(r*per, (r+1)*per); if(!part.length) part = list.slice(0, per);
      var h = '';
      part.forEach(function(n,k){
        h += '<span class="mq-s"><img src="'+S.asset('media/pf/'+n+'.jpg')+'" alt="" loading="lazy"></span>';
        if(k % 2 === 1){ h += '<span class="mq-c"><img src="'+S.asset('media/samples/'+cards[ci % cards.length]+'.jpg')+'" alt="" loading="lazy"></span>'; ci++; }
      });
      html += '<div class="mq-row r'+(r+1)+'"><div class="mq-track">'+h+h+'</div></div>';
    }
    bg.querySelector('.mq-rot').innerHTML = html;
  }
  S.onView(bg, function(on){ bg.classList.toggle('paused', !on); });
  bg.querySelectorAll('.mq-row').forEach(function(r){
    var tr = r.querySelector('.mq-track');
    function rate(v){ if(tr.getAnimations) tr.getAnimations().forEach(function(a){ a.playbackRate = v; }); }
    r.addEventListener('pointerenter', function(){ rate(.35); });
    r.addEventListener('pointerleave', function(){ rate(1); });
  });
});
</script>
