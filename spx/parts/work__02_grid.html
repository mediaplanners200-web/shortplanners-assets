<!-- 숏플래너스 · work / grid
     아임웹 코드 위젯에 이 파일 내용을 그대로 붙여 넣으세요. (00_common 위젯이 이 페이지 맨 위에 있어야 합니다) -->
<div class="spx" data-spx-page="work">
<section class="sec" style="padding-top:64px">
    <div class="wrap">
      <div class="grid-work" id="gridWork"></div>
    </div>
  </section>
</div>
<script>
SPX.def('work:work', function(S){
  var grid = document.getElementById('gridWork'); if(!grid) return;
  var list = S.pfShuffled();
  grid.innerHTML = list.map(function(n, i){
    var d = S.SPV[n-1];
    return '<button type="button" class="vcard" data-i="'+i+'" aria-label="숏폼 영상 보기"><div class="frame">'+S.thumb(n)+'<video muted loop playsinline preload="none" data-src="'+d.v+'"></video><span class="play"></span></div></button>';
  }).join('');
  grid.querySelectorAll('.vcard').forEach(function(c){
    var v = c.querySelector('video');
    c.addEventListener('pointerenter', function(e){ if(S.reduce || e.pointerType!=='mouse') return; if(!v.src) v.src=v.dataset.src; v.dataset.hover=1; S.play(v); c.classList.add('playing'); });
    c.addEventListener('pointerleave', function(){ v.pause(); c.classList.remove('playing'); });
    c.addEventListener('click', function(){ S.openModal(list, +c.dataset.i); });
  });
});
</script>
